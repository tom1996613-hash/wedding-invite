<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #8b5d5d;
      --bg-color: #faf7f2;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #777777;
      --gold: #b38b59;
      --border: #e8e2d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Serif TC', serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.8;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      min-height: 100vh;
      box-shadow: 0 4px 25px rgba(0,0,0,0.06);
    }
    /* Hero Section */
    .hero {
      text-align: center;
      padding: 60px 24px 40px;
      background: linear-gradient(180deg, #f5efe6 0%, #ffffff 100%);
      border-bottom: 1px solid var(--border);
    }
    .hero .sub-tag {
      font-family: 'Cinzel', serif;
      letter-spacing: 4px;
      font-size: 0.85rem;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    .greeting {
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 25px;
      font-weight: 600;
    }
    .names {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      letter-spacing: 3px;
      color: var(--text-main);
      margin-bottom: 10px;
    }
    .date-badge {
      display: inline-block;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      padding: 6px 20px;
      margin-top: 15px;
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      font-size: 0.95rem;
    }
    /* Countdown */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }
    .time-box {
      background: var(--bg-color);
      padding: 10px 14px;
      border-radius: 8px;
      min-width: 60px;
    }
    .time-box span {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }
    .time-box label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    /* Content Sections */
    section {
      padding: 40px 24px;
      border-bottom: 1px solid var(--border);
    }
    .sec-title {
      text-align: center;
      margin-bottom: 25px;
    }
    .sec-title h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--primary);
    }
    .sec-title p {
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 1px;
    }
    /* Details */
    .info-item {
      margin-bottom: 18px;
      text-align: center;
    }
    .info-item h4 {
      color: var(--gold);
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .btn-map {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 22px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      background: #fafafa;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }
    .radio-group label {
      font-weight: normal;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 2px;
      transition: opacity 0.2s;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .success-box {
      display: none;
      text-align: center;
      padding: 30px 10px;
    }
    .success-box h3 {
      color: var(--primary);
      margin-bottom: 10px;
    }
    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Header / Hero -->
  <header class="hero">
    <div class="sub-tag">The Wedding Issue</div>
    <div class="greeting" id="guestGreeting">親愛的朋友</div>
    <h1 class="names">GROOM & BRIDE</h1>
    <div class="date-badge">2027 . 03 . 13</div>

    <div class="countdown" id="countdown">
      <div class="time-box"><span id="days">00</span><label>Days</label></div>
      <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
      <div class="time-box"><span id="mins">00</span><label>Mins</label></div>
      <div class="time-box"><span id="secs">00</span><label>Secs</label></div>
    </div>
  </header>

  <!-- Section: Wedding Details -->
  <section>
    <div class="sec-title">
      <h2>THE WEDDING</h2>
      <p>婚禮時間與地點</p>
    </div>
    <div class="info-item">
      <h4>宴會時間</h4>
      <p>2027 年 3 月 13 日（星期六）</p>
      <p>17:00 迎賓酒會 ｜ 18:30 晚宴開始</p>
    </div>
    <div class="info-item">
      <h4>宴會地點</h4>
      <p>台北君悅酒店 3樓 宴會廳</p>
      <p>台北市信義區松壽路2號</p>
      <a href="https://maps.google.com" target="_blank" class="btn-map">開啟 Google 地圖</a>
    </div>
  </section>

  <!-- Section: RSVP Form -->
  <section id="rsvp">
    <div class="sec-title">
      <h2>R. S. V. P.</h2>
      <p>出席回覆調查</p>
    </div>

    <form id="rsvpForm">
      <div class="form-group">
        <label for="name">您的姓名 *</label>
        <input type="text" id="name" name="name" required placeholder="請填寫姓名">
      </div>

      <div class="form-group">
        <label>出席意願 *</label>
        <div class="radio-group">
          <label><input type="radio" name="attendance" value="一定出席" checked onclick="toggleAttend(true)"> 一定出席</label>
          <label><input type="radio" name="attendance" value="心意相隨（無法出席）" onclick="toggleAttend(false)"> 心意相隨</label>
        </div>
      </div>

      <div id="attendDetails">
        <div class="form-group">
          <label for="guests">出席總人數</label>
          <select id="guests" name="guests">
            <option value="1">1 位</option>
            <option value="2">2 位</option>
            <option value="3">3 位</option>
            <option value="4">4 位</option>
          </select>
        </div>

        <div class="form-group">
          <label for="vegetarian">其中素食人數</label>
          <select id="vegetarian" name="vegetarian">
            <option value="0">0 位</option>
            <option value="1">1 位</option>
            <option value="2">2 位</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">聯絡電話 *</label>
        <input type="tel" id="phone" name="phone" required placeholder="0912-345-678">
      </div>

      <div class="form-group">
        <label for="address">喜帖寄送地址（如需實體喜帖）</label>
        <input type="text" id="address" name="address" placeholder="郵遞區號與完整地址">
      </div>

      <div class="form-group">
        <label for="message">給新人的祝福</label>
        <textarea id="message" name="message" rows="3" placeholder="留下您溫暖的祝福..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">確認送出回覆</button>
    </form>

    <div class="success-box" id="successBox">
      <h3>✓ 回覆已送達</h3>
      <p>非常感謝您的回覆！我們期待在婚禮當天與您相見。</p>
    </div>
  </section>

  <footer>
    WITH LOVE & GRATITUDE<br>
    — FIN —
  </footer>
</div>

<script>
  // 1. 【填入您的 Google Apps Script Web App URL】
  const SCRIPT_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbwtVV8VY0wOsuIrI7gJclD3aLxXWh2rJWdr1Z94uaI/dev/exec";

  // 2. 婚禮目標日期 (年, 月-1, 日, 時, 分)
  const weddingDate = new Date(2027, 2, 13, 12, 30, 0).getTime();

  // 3. 解析網址參數 ?to=賓客稱謂
  const urlParams = new URLSearchParams(window.location.search);
  const guestName = urlParams.get('to');
  const greetingElem = document.getElementById('guestGreeting');
  const nameInput = document.getElementById('name');

  if (guestName) {
    greetingElem.textContent = `親愛的 ${guestName}`;
    nameInput.value = guestName; // 自動填入表單姓名
  }

  // 4. 倒數計時器
  function updateCountdown() {
    const now = new Date().getTime();
    const distance = weddingDate - now;

    if (distance > 0) {
      document.getElementById('days').innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
      document.getElementById('hours').innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
      document.getElementById('mins').innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
      document.getElementById('secs').innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
    }
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();

  // 5. 切換出席/不出席欄位顯示
  function toggleAttend(attending) {
    document.getElementById('attendDetails').style.display = attending ? 'block' : 'none';
  }

  // 6. 表單提交至 Google Sheets
  const form = document.getElementById('rsvpForm');
  const submitBtn = document.getElementById('submitBtn');
  const successBox = document.getElementById('successBox');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = "傳送中...";

    const payload = {
      greeting: guestName || '',
      name: form.name.value,
      attendance: form.attendance.value,
      guests: form.attendance.value === "一定出席" ? form.guests.value : 0,
      vegetarian: form.attendance.value === "一定出席" ? form.vegetarian.value : 0,
      phone: form.phone.value,
      address: form.address.value,
      message: form.message.value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // 避免跨域 CORS 阻擋
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      form.style.display = 'none';
      successBox.style.display = 'block';
    })
    .catch(err => {
      alert('傳送失敗，請稍後再試或直接聯繫新人。');
      submitBtn.disabled = false;
      submitBtn.innerText = "確認送出回覆";
    });
  });
</script>

</body>
</html>
